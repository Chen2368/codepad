name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      # 用 continue-on-error + 报告回推：日志接口需要认证，但「推到分支」我随时能读
      - name: 静态检查
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "## 环境"
            flutter --version || true
            echo
            echo "## dart analyze"
            dart analyze 2>&1 || true
            echo
            echo "## flutter analyze"
            flutter analyze 2>&1 || true
          } > analyze-report.md
          echo "--- 报告 ---"
          cat analyze-report.md

      - name: 报告推到 ci-report 分支
        if: always()
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-report
          git add -f analyze-report.md
          git commit -m "ci: analyze 报告 (${{ github.sha }})" || echo "没有变化"
          git push -f origin ci-report || echo "推送失败（可能是只读 token）"

      - name: 静态检查未通过则失败
        if: steps.analyze.outcome == 'failure'
        run: |
          echo "flutter analyze 未通过，详见 ci-report 分支的 analyze-report.md" >&2
          exit 1

      # 单元与组件测试不需要 Android SDK，也不需要内置 C 工具链
      - name: 测试
        run: flutter test --reporter expanded