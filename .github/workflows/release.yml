name: Release

# 打 tag（v*）时自动：组装内置 C 工具链 → 构建 arm64 APK → 创建 Release 并附上 APK。
# 用的是 GitHub 自带的 GITHUB_TOKEN，不需要在仓库里存任何密钥。
#
# 手动触发也可以：Actions → Release → Run workflow（填一个已存在的 tag）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.1）'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布 arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      # .deb 是 ar 归档，Ubuntu 的 GNU tar 读不了；装 bsdtar（libarchive）供脚本使用
      - name: 安装 bsdtar
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # 仓库不含编译器二进制：脚本从 Termux 源下载 tcc + bionic 头文件并组装
      - name: 组装内置 C 工具链
        id: toolchain
        shell: pwsh
        run: ./scripts/fetch-toolchain.ps1

      # 失败时把输出推到 ci-report 分支，便于离线排查（日志接口需要认证）
      - name: 工具链失败报告
        if: failure() && steps.toolchain.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p ci-debug
          pwsh -NoProfile -Command "\$ErrorActionPreference='Continue'; ./scripts/fetch-toolchain.ps1 *>&1 | Tee-Object -FilePath ci-debug/toolchain.log" || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-report
          git add -f ci-debug/toolchain.log
          git commit -m "ci: 工具链组装失败日志 (${{ github.sha }})" || true
          git push -f origin ci-report || true

      # 质量门禁由 CI 工作流负责（push/pr 都会跑）；这里只记录结果，不阻塞发布，
      # 否则「analyze 的一个 info 级提示」就能挡住 APK 产出。日志回推 ci-report 便于排查。
      - name: 静态检查（不阻塞）
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "## Release 环境"
            flutter --version || true
            echo
            echo "## flutter analyze"
            flutter analyze 2>&1 || true
          } > analyze-release.md
          cat analyze-release.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-report
          git add -f analyze-release.md
          git commit -m "ci: release analyze 报告 (${{ github.sha }})" || true
          git push -f origin ci-report || true
          git checkout -B main "origin/main" || true

      - name: 单元测试（不阻塞）
        continue-on-error: true
        run: flutter test

      # 本地为了速度用腾讯 Gradle 镜像 + 阿里云 Maven 镜像；GitHub runner 访问这些会超时
      # （日志里是 "Could not HEAD https://maven.aliyun.com/..."，51 个依赖全挂）。
      # 所以 CI 里临时替换成官方源 —— 只改工作区文件，不改仓库内容。
      - name: 换成官方 Gradle / Maven 源
        run: |
          python3 - <<'PY'
          import re, pathlib

          wrap = pathlib.Path('android/gradle/wrapper/gradle-wrapper.properties')
          s = wrap.read_text()
          s = re.sub(r'https\\?://mirrors\.cloud\.tencent\.com/gradle/',
                     'https\\://services.gradle.org/distributions/', s)
          wrap.write_text(s)
          print('--- gradle-wrapper.properties ---')
          print(s)

          settings = pathlib.Path('android/settings.gradle.kts')
          lines = settings.read_text().splitlines()
          kept = [l for l in lines if 'maven.aliyun.com' not in l]
          settings.write_text('\n'.join(kept) + '\n')
          print('--- settings.gradle.kts repositories ---')
          print('\n'.join(kept))
          PY

      - name: 构建 APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log

      - name: 构建失败报告
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p ci-debug
          tail -n 400 build.log > ci-debug/build.log || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-report
          git add -f ci-debug/build.log
          git commit -m "ci: 构建失败日志 (${{ github.sha }})" || true
          git push -f origin ci-report || true

      - name: 记录产物信息
        id: artifact
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          DEST=CodePad-$(echo "${{ github.ref_name }}" | sed 's/^v//')-release-arm64.apk
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CodePad ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ steps.artifact.outputs.path }}
          body: |
            平板上的 C 语言 IDE —— 内置 TinyCC 0.9.27（aarch64），真编译、真运行。

            **安装**：下载 `${{ steps.artifact.outputs.path }}`（**仅 arm64**），
            平板上直接安装；打开后到「设置 → 编译器 → 运行编译器自检」，应为 7 项全绿。

            **校验**：`sha256 ${{ steps.artifact.outputs.sha256 }}`

            **第三方组件**：TinyCC (LGPL-2.1)、bionic 头文件 (Apache-2.0)，详见 THIRD_PARTY_NOTICES.md。

            **本版变化**：见仓库 docs/phase3-checklist.md 的最后一节。